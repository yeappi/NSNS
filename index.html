/* 並び：src の直後に list を差し込む */
async function insertAfter(src,list,pid){const sibs=sortNodes(kids(pid)).filter(x=>!list.includes(x));const i=sibs.indexOf(src);
  const all=i<0?[...list,...sibs]:[...sibs.slice(0,i+1),...list,...sibs.slice(i+1)];all.forEach((x,k)=>{x.parentId=pid;x.order=k});await saveNodes(all)}
/* 「元の部屋名」フォルダを用意（同じ名前のフォルダの中にいれば、それを使う）。src はフォルダへ移す */
async function ensureFolder(src,iid,moved){
  const p=src.parentId&&S.nodes.get(src.parentId);if(p&&p.type==='folder'&&p.name===src.name)return p;
  const pid=src.parentId||null;
  const f={id:uid(),type:'folder',parentId:pid,name:src.name,emoji:'',color:src.color||PALETTE[2],tags:[],order:src.order??0,createdAt:now()};if(iid)f.importId=iid;
  moved&&moved.push({id:src.id,parentId:src.parentId||null,order:src.order??0});
  const sibs=sortNodes(kids(pid)).map(x=>x===src?f:x);sibs.forEach((x,k)=>x.order=k);
  src.parentId=f.id;src.order=0;await saveNodes([f,...sibs.filter(x=>x!==f),src]);return f;
}
const uniqName=(base,pid)=>{const names=new Set(kids(pid).map(k=>k.name));if(!names.has(base))return base;let i=2;while(names.has(`${base} ${i}`))i++;return `${base} ${i}`};
function mkRoom(pid,name,color,extra){if(extra&&extra.mrun)extra.qroom=true;return Object.assign({id:uid(),type:'room',parentId:pid,name:name.slice(0,60),emoji:'',color:color||PALETTE[Math.floor(Math.random()*7)],tags:[],badge:true,order:0,createdAt:now(),lastAt:now()},extra||{})}
async function mStart(mid,rid,fold){
  const c=MCB.get(mid),src=S.nodes.get(rid);if(!c||!src)return;
  const needF=c.rm!=='one'||fold;let pid=src.parentId||null,base=src.name;
  if(needF){const f=await ensureFolder(src,null,null);pid=f.id}
  const rooms=[];
  if(c.rm==='one'){const st=mSteps(c);rooms.push(mkRoom(pid,uniqName(needF?c.n:`${base}｜${c.n}`,pid),src.color,{mrun:{mid,pos:0}}))}
  else if(c.rm==='frames')c.frames.forEach(([lb,q])=>rooms.push(mkRoom(pid,uniqName(`${c.n}｜${lb}`,pid),null,{mrun:{mid,pos:0,steps:[q]}})));
  else{c.targets.forEach(lb=>rooms.push(mkRoom(pid,uniqName(`${c.n}｜${lb}`,pid),null,{mrun:{mid,pos:0,steps:[...c.q]}})));
    if(c.final)rooms.push(mkRoom(pid,uniqName(`${c.n}｜比べる`,pid),null,{mrun:{mid,pos:0,steps:[...c.final]}}))}
  await insertAfter(src,rooms,pid);
  const mu=LS.get('mstats',{});mu[mid]=(mu[mid]||0)+1;LS.set('mstats',mu);
  if(needF&&c.rm!=='one'){S.cwd=pid}
  openRoom(rooms[0].id);renderList();
  if(c.rm!=='one')toast(`「${src.name}」フォルダに${rooms.length}個のトークを作りました`);
}

/* ---- フォルダの中身の数・問いの進み具合 ---- */
function folderCounts(n){
  const ks=kids(n.id);let r=0,f=0,a=0,qt=0,qa=0;
  for(const k of ks){if(k.type==='folder'){f++;continue}if(k.archived){a++;continue}r++;
    if(k.qroom||k.mrun){qt++;if(roomMsgs(k.id).some(m=>m.by!=='ai'))qa++}}

}

/* =========================================================

const ACTW=210;let lastPtype='mouse';
const lselList=()=>sortNodes(kids(S.cwd)).filter(k=>S.lsel&&S.lsel.has(k.id));
document.addEventListener('pointerdown',e=>{lastPtype=e.pointerType;G.suppress=false},true);
const G={el:null,timer:null,suppress:false};
const D={active:false};
function hideActs(it){setTimeout(()=>{if(it&&!it.style.transform)it.parentElement?.classList.remove('sw')},260)}
function closeSwipe(){if(!S.swiped)return;const it=document.querySelector(`.iw[data-nid="${S.swiped}"] > .item`);if(it){it.style.transform='';hideActs(it)}S.swiped=null}
document.addEventListener('pointerdown',e=>{
  if(D.active)return;
  const it=e.target.closest('.iw:not([data-static]) > .item');
  if(!it||S.lsel||(e.pointerType==='mouse'&&e.button!==0))return;
  if(e.target.closest('.more'))return;
  G.el=it;G.id=it.dataset.id;G.x=G.lx=e.clientX;G.y=G.ly=e.clientY;G.mode=null;G.pid=e.pointerId;G.base=S.swiped===G.id?-ACTW:0;G.tx=G.base;
  clearTimeout(G.timer);G.timer=setTimeout(()=>{if(G.el===it&&!G.mode){G.mode='drag';if(S.swiped)closeSwipe();startDrag()}},420);
});
document.addEventListener('pointermove',e=>{
  if(!G.el||e.pointerId!==G.pid)return;G.lx=e.clientX;G.ly=e.clientY;
  const dx=e.clientX-G.x,dy=e.clientY-G.y;
  if(!G.mode&&Math.hypot(dx,dy)>8){clearTimeout(G.timer);
    if(Math.abs(dx)>Math.abs(dy)*1.2){G.mode='swipe';if(S.swiped&&S.swiped!==G.id)closeSwipe();G.el.parentElement.classList.add('sw');G.el.style.transition='none';try{G.el.setPointerCapture(e.pointerId)}catch(_){}}
    else G.mode='scroll'}
  if(G.mode==='swipe'){G.tx=Math.min(20,Math.max(-ACTW-50,G.base+dx));G.el.style.transform=`translateX(${G.tx}px)`}
  else if(G.mode==='drag')moveDrag(e.clientX,e.clientY);
});
function gEnd(e){
  if(!G.el||e.pointerId!==G.pid)return;clearTimeout(G.timer);
  const it=G.el,mode=G.mode;G.el=null;
  if(mode==='swipe'){it.style.transition='';const open=G.tx<-ACTW/2;it.style.transform=open?`translateX(${-ACTW}px)`:'';if(!open)hideActs(it);S.swiped=open?G.id:null;G.suppress=true;setTimeout(()=>G.suppress=false,350)}
  else if(mode==='drag'){G.suppress=true;setTimeout(()=>G.suppress=false,350);endDrag(e.type==='pointercancel')}
}
document.addEventListener('pointerup',gEnd);document.addEventListener('pointercancel',gEnd);
document.addEventListener('touchmove',e=>{if(G.el&&(G.mode==='drag'||G.mode==='swipe'))e.preventDefault()},{passive:false});

function startDrag(){
  const it=G.el;const r=it.getBoundingClientRect();
  Object.assign(D,{active:true,id:G.id,offX:G.x-r.left,offY:G.y-r.top,target:null,hoverKey:null,lx:G.lx,ly:G.ly});
  const g=it.cloneNode(true);g.classList.add('ghost');g.classList.remove('active','dragging');g.querySelector('.more')?.remove();
  g.style.width=r.width+'px';g.style.transform='scale(.94)';document.body.appendChild(g);D.ghost=g;
  it.classList.add('dragging');document.body.classList.add('dragging-on');
  navigator.vibrate&&navigator.vibrate(12);
  drawUpbar();posGhost();D.raf=requestAnimationFrame(autoScroll);
}

function updateTarget(){
  if(!D.active)return;const x=D.lx,y=D.ly;clearMarks();
  const el=document.elementFromPoint(x,y);
  if(el&&el.closest('#upbar')){$('#upbar').classList.add('hot');D.target={type:'up'};setHover('up',goUpDrag,700);return}

    w.classList.add('drop-'+zone);D.target={type:'node',id:tn.id,zone};

    if(D.ly>r.top+off&&D.ly<r.top+off+44)v=-7;else if(D.ly>r.bottom-56&&D.ly<r.bottom+20)v=7;

async function placeNode(n,pid,pos){
  if(pid&&(pid===n.id||ancestors(pid).some(a=>a.id===n.id)))return;
  const sibs=sortNodes(kids(pid)).filter(x=>x.id!==n.id);
  const i=pos==='top'?0:pos==='end'?sibs.length:Math.max(0,sibs.findIndex(x=>x.id===pos.ref))+(pos.after?1:0);
  sibs.splice(i,0,n);n.parentId=pid;sibs.forEach((x,k)=>x.order=k);await saveNodes(sibs);

  b.parentId=f.id;b.order=0;a.parentId=f.id;a.order=1;
  await saveNodes([...sibs,a,b]);
  toast('フォルダにまとめました','名前をつける',()=>editNodeSheet(S.nodes.get(f.id)));
}

/* outbox は本体DBとは別のIndexedDBに置く（本体DBのバージョンを上げずに済み、開いたままの別タブに邪魔されない） */
const SQ={
  db:null,mem:new Map(),
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('nsns-sync',1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('outbox'))r.result.createObjectStore('outbox',{keyPath:'id'})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})}catch(e){this.db=null}},
  req(mode,fn){return new Promise((res,rej)=>{const tx=this.db.transaction('outbox',mode);const r=fn(tx.objectStore('outbox'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})},
  async all(){return this.db?this.req('readonly',o=>o.getAll()):[...this.mem.values()]},
  async get(id){return this.db?this.req('readonly',o=>o.get(id)):this.mem.get(id)},
  async putMany(a){if(!a.length)return;if(!this.db){a.forEach(v=>this.mem.set(v.id,v));return}await this.req('readwrite',o=>{let r;a.forEach(v=>r=o.put(v));return r})},
  async del(id){if(!this.db){this.mem.delete(id);return}await this.req('readwrite',o=>o.delete(id))},
  async clear(){if(!this.db){this.mem.clear();return}await this.req('readwrite',o=>o.clear())},
};

  async postRows(rows){

  async flushRecords(ents){
    const uid=this.sess.uid;const recs=ents.filter(e=>e.op==='put'||e.op==='del');
    for(let i=0;i<recs.length;i+=100){
      const chunk=recs.slice(i,i+100);const rows=[];
      for(const e of chunk){
        const tomb={user_id:uid,store:e.store,id:e.rid,data:null,deleted:true,client_updated_at:e.t};
        if(e.op==='del'){rows.push(tomb);continue}

      }
      if(!await this.postRows(rows)){
        if(rows.length>1){for(const row of rows)if(!await this.postRows([row]))this.dropped++} // 1件ずつ試し、ダメな1件だけ諦める
        else this.dropped++;

  /* ---- 取り込む ---- */
  mem(s,id,rec){ // 画面が持っているメモリ上の状態も合わせる
    if(s==='nodes'){S.nodes.delete(id);S.tnodes.delete(id);if(rec)(rec.deletedAt?S.tnodes:S.nodes).set(id,rec)}
    else if(s==='messages'){S.msgs.delete(id);S.tmsgs.delete(id);if(rec)(rec.deletedAt?S.tmsgs:S.msgs).set(id,rec)}
    else if(s==='exports'){S.exports.delete(id);if(rec)S.exports.set(id,rec)}

  },
  async apply(rows){
    let ch=false;
    for(const r of rows){
      if(!SYNCED.includes(r.store))continue;
      const local=await DB.get(r.store,r.id);
      const pend=await SQ.get(r.store+'/'+r.id);
      const mine=Math.max(local?(local._u||0):0,pend&&pend.op==='del'?pend.t:0);
      const ru=Number(r.client_updated_at);
      if(ru<=mine)continue; // こちらの方が新しい（同じ）なら何もしない
      if(r.deleted){
        if(local){await RAW.del(r.store,r.id);this.mem(r.store,r.id,null);ch=true}
      }else{
        const rec={...r.data,_u:ru};
        await RAW.put(r.store,rec);this.mem(r.store,r.id,rec);ch=true;
      }
      if(pend)await SQ.del(pend.id);
    }
    return ch;
  },
  async pull(){
    const cur=LS.get('sync:cursor','');
    let since=cur?new Date(new Date(cur).getTime()-120000).toISOString():'1970-01-01T00:00:00Z'; // 2分さかのぼる（取りこぼし防止）
    let changed=false,newest=cur;
    for(;;){
      const r=await this.api('/rest/v1/nsns_records?select=store,id,data,deleted,client_updated_at,updated_at&order=updated_at.asc&limit=500&updated_at=gt.'+encodeURIComponent(since));
      if(!r.ok)throw new Error('pull '+r.status);
      const rows=await r.json();
      if(!rows.length)break;
      if(await this.apply(rows))changed=true;
      since=rows[rows.length-1].updated_at;
      if(!newest||new Date(since)>new Date(newest))newest=since;
      if(rows.length<500)break;
    }
    if(newest)LS.set('sync:cursor',newest);
    return changed;

  /* ---- 1回分の同期 ---- */
  async run(){
    if(!this.sess)return;
    if(this.running){this.again=true;return}
    this.running=true;this.err='';let more=false;
    try{
      const uid=this.sess.uid;
      if(!LS.get('sync:init:'+uid,0)){await this.enqueueAll();LS.set('sync:init:'+uid,1)}
      await this.flushRecords(await SQ.all());
      const ch=await this.pull();
      await this.flushRecords(await SQ.all());
      const left=await this.flushBlobs(await SQ.all());
      const f=await this.fetchBlobs();
      more=left>0||f.rest>0;
      if(ch||f.got)this.refresh();
      this.last=now();LS.set('sync:last',this.last);
    }catch(e){
      this.err=!this.sess?'ログインが切れました。設定の「クラウド同期」から入り直してください'
        :(navigator.onLine===false?'オフラインです（つながったら自動で同期します）':'同期できませんでした（あとで自動で再試行します）');
    }finally{
      this.running=false;
      if(this.again||more){this.again=false;setTimeout(()=>this.run(),more?1000:300)}
    }
  },
  start(){
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.run()});
    window.addEventListener('online',()=>this.run());
    setInterval(()=>{if(!document.hidden)this.run()},45000);
    this.run();
  },
};
/* 保存の出入口に「送る印」を足す。ログインしていなければ何も起きない（enabled が false のまま） */

DB.putMany=async function(s,a){if(SYNC.enabled&&SYNCED.includes(s)){const t=now();a.forEach(v=>v._u=t)}await RAW.putMany(s,a);if(a.length)SYNC.note(s,a.map(v=>v.id),'put')};

async function syncSheet(){
  const when=t=>t?`${mdhm(t)}`:'まだありません';
  if(!SYNC.sess){
    const sh=openSheet(`<h3>クラウド同期</h3>
      <div class="note" style="margin-bottom:14px">ログインすると、PCとスマホでメモがそろいます。ログインしなければ、今までどおりこの端末の中だけで使えます。<br>ログインしても、この端末のデータは消えません。</div>
      <div class="field"><label>メールアドレス</label><input class="inp" id="sbMail" type="email" autocomplete="email" inputmode="email" value="${esc(LS.get('sync:mail',''))}"></div>
      <div class="field"><label>パスワード（8文字以上）</label><input class="inp" id="sbPw" type="password" autocomplete="current-password"></div>
      <div id="sbMsg" class="note" style="display:none;margin-bottom:10px"></div>
      <div class="btns"><button class="btn" data-x="up">新規登録</button><button class="btn pri" data-x="in">ログイン</button></div>`);
    const msg=t=>{const m=sh.querySelector('#sbMsg');m.textContent=t;m.style.display=t?'block':'none'};
    const go=async signup=>{
      const email=sh.querySelector('#sbMail').value.trim(),pw=sh.querySelector('#sbPw').value;
      if(!email||pw.length<8){msg('メールアドレスと、8文字以上のパスワードを入れてください');return}
      LS.set('sync:mail',email);sh.querySelectorAll('button').forEach(b=>b.disabled=true);msg(signup?'登録しています…':'ログインしています…');
      try{
        const r=await SYNC.login(email,pw,signup);
        if(r==='confirm'){msg('確認メールを送りました。メールの確認が終わったら、ここからログインしてください。');sh.querySelectorAll('button').forEach(b=>b.disabled=false);return}
        closeSheet();toast('同期をはじめました');
      }catch(e){
        const c=e.code||'';
        msg(c==='invalid_credentials'?'メールかパスワードが違います':c==='email_not_confirmed'?'メールの確認がまだです。届いたメールを確認してください':c==='user_already_exists'?'このメールは登録済みです。「ログイン」を押してください':/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'つながりませんでした。ネットワークを確認してください':e.message);
        sh.querySelectorAll('button').forEach(b=>b.disabled=false);
      }
    };
    sh.querySelector('[data-x=in]').onclick=()=>go(false);sh.querySelector('[data-x=up]').onclick=()=>go(true);
    sh.querySelector('#sbPw').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229)go(false)});
    return;
  }
  const waiting=(await SQ.all()).length;
  const sh=openSheet(`<h3>クラウド同期</h3>
    <div class="note" style="margin-bottom:12px">ログイン中：<b>${esc(SYNC.sess.email||'')}</b><br>
    最後の同期：<b>${when(SYNC.last)}</b>${SYNC.running?'（いま同期中…）':''}<br>
    送り待ち：${waiting}件${SYNC.err?`<br><span style="color:#C9583F">${esc(SYNC.err)}</span>`:''}${SYNC.dropped?`<br>受け付けられなかった項目：${SYNC.dropped}件`:''}</div>
    <div class="menu">
      <button data-m="now"><span class="ic">🔄</span><span>今すぐ同期</span></button>
      <button data-m="all"><span class="ic">☁️</span><span>この端末の全部をもう一度アップロード<span class="sub">うまくそろわないときに</span></span></button>
      <button data-m="out"><span class="ic">🚪</span><span>ログアウト<span class="sub">この端末のデータは消えません</span></span></button>
    </div>`);
  sh.querySelector('[data-m=now]').onclick=()=>{closeSheet();SYNC.run();toast('同期しています…')};
  sh.querySelector('[data-m=all]').onclick=async()=>{closeSheet();await SYNC.enqueueAll();SYNC.run();toast('アップロードしています…')};
  sh.querySelector('[data-m=out]').onclick=async()=>{closeSheet();await SYNC.logout();toast('ログアウトしました')};
}

/* 新しい版の知らせ：開いている間に本番が更新されたら「更新」を出す（押すまで何も変えない） */
function verHash(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return t.length+':'+h}
const verScripts=root=>verHash([...root.querySelectorAll('script:not([src])')].map(x=>x.textContent).join('\n'));
const verTag=()=>Math.abs(parseInt(verScripts(document).split(':')[1])||0).toString(36).slice(0,5);
async function appReload(){try{for(const k of await caches.keys())if(k.startsWith('nsns-shell-'))await caches.delete(k);
    const rs=(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)?await navigator.serviceWorker.getRegistrations():[];await Promise.all(rs.map(r=>r.update().catch(()=>0)))}catch(e){}
  location.reload()}
async function appRefresh(){
  toast('最新版を確認しています…');let same;
  try{same=(await verFetch())===verScripts(document)}catch(e){toast('確認できませんでした（オフラインかもしれません）');return}
  if(same){toast(`すでに最新です（版 ${verTag()}）`,'それでも再読み込み',appReload);return}
  if([...document.querySelectorAll('textarea')].some(t=>t.value.trim())&&!await confirmSheet('書きかけがあります','更新すると、入力欄の書きかけは消えます。保存済みのメモは消えません。','更新する'))return;
  appReload()}
async function verFetch(){const r=await fetch('/index.html?_v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return verScripts(new DOMParser().parseFromString(await r.text(),'text/html'))}
function verWatch(){
  if(!/^https?:$/.test(location.protocol)||location.protocol==='file:')return;
  let base=verScripts(document),shown=false,last=0;
  const show=()=>{if(shown)return;shown=true;const b=document.createElement('div');b.id='verbar';
    b.innerHTML='<span>新しい版があります</span><button>更新</button><button class="x" aria-label="閉じる">×</button>';
    b.querySelector('button').onclick=appReload;b.querySelector('.x').onclick=()=>b.remove();document.body.appendChild(b)};
  const check=async()=>{if(shown||document.hidden||!navigator.onLine||Date.now()-last<20000)return;last=Date.now();
    try{const h=await verFetch();if(h!==base)show()}catch(e){}};
  check();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  setInterval(check,10*60*1000);
}
(async()=>{
  await DB.open();

  const [n,m,x,p]=await Promise.all(['nodes','messages','exports','presets'].map(s=>DB.all(s)));
  n.forEach(v=>(v.deletedAt?S.tnodes:S.nodes).set(v.id,v));m.forEach(v=>(v.deletedAt?S.tmsgs:S.msgs).set(v.id,v));x.forEach(v=>S.exports.set(v.id,v));p.forEach(v=>S.presets.set(v.id,v));bump();
  await purgeTrash(x=>x.deletedAt<now()-90*86400000);

<script>
/* iOS キーボード対応（LINE方式）
   - キーボードが出たら、アプリ全体を「見えている範囲」にぴったり合わせる（ヘッダーは上に残る）
   - トークの中身は、下端に揃っていたら下端のまま／中身が少なくて余白があるなら動かさない
   - 判定は「画面の高さ − 見えている高さ」で行う。iOSが画面をずらした量(offsetTop)を引くと、
     ずらされた時だけ「キーボードなし」と誤判定してしまうため引かない */
(function(){
  const app=document.getElementById('app'),vv=window.visualViewport;
  if(!app||!vv)return;
  let raf=0,wasKb=false;
  const anchors=[];
  function snapshot(){ // 変化前に「下端からの距離」を覚える
    anchors.length=0;
    document.querySelectorAll('#chat').forEach(c=>anchors.push([c,c.scrollHeight-c.scrollTop-c.clientHeight]));
  }
  function update(){
    raf=0;
    const a=document.activeElement;
    const typing=!!a&&/^(INPUT|TEXTAREA)$/.test(a.tagName);
    const kb=typing&&(window.innerHeight-vv.height)>120;
    snapshot();
    if(kb){
      app.style.setProperty('--kb-top',Math.round(window.scrollY+vv.offsetTop)+'px');
      app.style.setProperty('--kb-height',Math.round(vv.height)+'px');
      app.classList.add('keyboard-visible');
    }else{
      app.classList.remove('keyboard-visible');
      app.style.removeProperty('--kb-top');app.style.removeProperty('--kb-height');
      if(wasKb&&(window.scrollY||vv.offsetTop))window.scrollTo(0,0); // iOSがずらしたままの分を戻す
    }
    wasKb=kb;
    // 中身があふれている時だけ、下端からの距離を保つ（あふれていなければ scrollTop は0のまま＝動かない）
    for(const [c,fromBottom] of anchors){
      const max=c.scrollHeight-c.clientHeight;
      if(max>0)c.scrollTop=Math.max(0,max-Math.max(0,fromBottom));
    }
  }
  function schedule(){if(!raf)raf=requestAnimationFrame(update)}
  vv.addEventListener('resize',schedule);
  vv.addEventListener('scroll',schedule);
  window.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule);
  document.addEventListener('focusin',schedule);
  document.addEventListener('focusout',()=>requestAnimationFrame(schedule));
  schedule();
})();
</script>
